services:
  - type: web
    name: shramsetu
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: NODE_ENV=production node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: SEED_ON_BOOT
        value: "true"
      # Set to your own mobile number. Without it nobody can hold the admin
      # role — the deliberate fail-closed default.
      - key: OWNER_PHONES
        sync: false
      # Razorpay. Without these, online payment is disabled and bookings
      # settle in cash on completion — the app stays fully usable either way.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # One-shot cleanup for a deployment that was demo-seeded before it went
      # live. Note this file only takes effect on a Blueprint-managed service;
      # on a service created through the dashboard, set it there instead.
      # Idempotent, and refuses a database without the demo seed's mark.
      - key: PURGE_DEMO
        value: "false"
