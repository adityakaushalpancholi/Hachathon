services:
  - type: web
    name: shramsetu
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: NODE_ENV=production node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: SEED_ON_BOOT
        value: "true"
      # Set to your own mobile number. Without it nobody can hold the admin
      # role — the deliberate fail-closed default.
      - key: OWNER_PHONES
        sync: false
      # Codes are written to the log stream until a provider is configured.
      - key: SMS_PROVIDER
        value: log
      # One-shot cleanup for a deployment that was demo-seeded before it went
      # live: set to "true", redeploy, then set it back. Refuses to touch a
      # database without the demo seed's mark, and keeps the catalogue.
      - key: PURGE_DEMO
        value: "false"
